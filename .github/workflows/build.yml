name: Build and Publish

on:
  # 统一入口保留原测试工作流对所有分支、标签和 PR 的覆盖。
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    name: Tests and checks
    uses: ./.github/workflows/test.yml

  build:
    name: Build image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: checks
    # 测试全部通过后才构建镜像，并保留原来的镜像构建事件范围。
    if: >-
      (github.event_name != 'pull_request' || github.base_ref == 'master') &&
      (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: external-db
            is_primary: true
          - variant: all-in-one
            is_primary: false
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=raw,value=latest,enable=${{ matrix.is_primary && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
            type=semver,pattern={{version}},enable=${{ matrix.is_primary }}
            type=sha,prefix=${{ matrix.variant }}-
          flavor: latest=false

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.variant }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
