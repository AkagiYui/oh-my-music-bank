name: Regression tests
on:
  # 仅由入口工作流调用，避免同一次推送重复执行测试。
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ommb-ci-test-only
          POSTGRES_DB: ommb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMMB_TEST_DSN: postgres://postgres:ommb-ci-test-only@127.0.0.1:5432/ommb_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # 以完整依赖校验和作为缓存键，依赖变化时刷新缓存。
          cache-dependency-path: go.sum
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: go build -o /dev/null ./cmd/server/.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          working-directory: web
          version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp test run
      - run: vp check
      - run: vp build
      - run: vp exec playwright install --with-deps chromium
      - run: vp run test:e2e
