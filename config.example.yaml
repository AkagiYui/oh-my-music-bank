# Oh My Music Bank 配置示例。复制为 config.yaml 后按需修改。
# 也可全部用环境变量覆盖（见 .env.example）。环境变量优先级高于本文件。

server:
  host: 0.0.0.0
  port: 9111
  # 设置后优先使用 Unix socket（与 Caddy 直连）。容器内由入口脚本设置。
  # socket: /var/run/ommb/server.sock
  debug: false

database:
  # 推荐用环境变量 DB 或 OMMB_DATABASE_DSN 设置：
  #   postgres://user:password@host:5432/oh-my-music-bank?sslmode=disable
  dsn: ""
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime_secs: 1800
  conn_max_idle_time_secs: 300
  retry_max_attempts: 5

auth:
  # 生产务必用环境变量 JWT_SECRET / OMMB_AUTH_JWT_SECRET 设置强随机值。
  jwt_secret: "change-me"
  access_token_ttl: "48h"
  refresh_token_ttl: "168h"

# S3 兼容对象存储：公共桶与私有桶是两套完全独立的连接，各自配置 endpoint、凭据与桶名，
# 可以位于不同的服务商或账号。同一 endpoint 下不允许两者使用同一个桶。
storage:
  # 公共桶仅承载可匿名读取的封面与头像。
  public:
    endpoint: "https://cn-nb1.rains3.com"
    access_key: ""
    secret_key: ""
    bucket: ""
    region: ""
    # 公共桶或 CDN 的 HTTPS 访问前缀，如 https://<bucket>.cn-nb1.rains3.com
    base_url: ""
  # 私有桶承载音频、原始文件与暂存文件，只通过预签名 URL 访问。
  private:
    endpoint: "https://cn-nb1.rains3.com"
    access_key: ""
    secret_key: ""
    bucket: ""
    region: ""
    presigned_url_ttl: "30m"

upload:
  max_size_mb: 200

recognize:
  # 镜像内预置的网易云指纹资源目录（afp.wasm 与 sandbox.bundle.js）。
  # 管理员在集成配置里拉取的副本优先，此目录仅作回落；对应 OMMB_RECOGNIZE_NETEASE_AFP_DIR。
  netease_afp_dir: "/opt/ommb/netease-afp"
