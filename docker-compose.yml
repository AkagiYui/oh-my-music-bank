# 使用外部数据库与对象存储运行（读取 .env 中的 DB / S3_PUBLIC_* / S3_PRIVATE_* / JWT_SECRET）。
# 启动：docker compose up -d --build
services:
  app:
    build:
      context: .
      dockerfile: Containerfile
      target: external-db
    env_file: .env
    ports:
      - "8080:80"
    restart: unless-stopped

