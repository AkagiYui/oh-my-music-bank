<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oh My Music Bank</title>
    <meta name="description" content="自定义音源系统 —— 上传、解析、检索与分发音频" />
    <script>
      // 首屏前根据偏好设置深浅色，避免闪烁。
      (function () {
        try {
          var t = localStorage.getItem('ommb.theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
